name: release-macos

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version embedded in the macOS package"
        required: true
        default: "0.1.0-dev"

permissions:
  contents: write

jobs:
  macos-arm64-dmg:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build macOS DMG
        env:
          PACKAGE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          chmod +x packaging/macos/build-dmg.sh
          ./packaging/macos/build-dmg.sh \
            --version "$PACKAGE_VERSION" \
            --arch arm64 \
            --output "$RUNNER_TEMP/ipv6mesh-macos-dist"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipv6mesh-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}-macos-arm64
          path: ${{ runner.temp }}/ipv6mesh-macos-dist/*
          if-no-files-found: error

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/ipv6mesh-macos-dist"/*.dmg \
            "$RUNNER_TEMP/ipv6mesh-macos-dist"/*.sha256 \
            --clobber
