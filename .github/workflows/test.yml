name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        shell: bash
        run: |
          formatted_files="$(gofmt -l .)" || {
            echo "gofmt failed" >&2
            exit 1
          }
          if [[ -n "$formatted_files" ]]; then
            echo "gofmt required for:" >&2
            printf '%s\n' "$formatted_files" >&2
            exit 1
          fi

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        shell: pwsh
        run: |
          $formatted = gofmt -l .
          if ($formatted) {
            Write-Error "gofmt required for: $formatted"
          }
