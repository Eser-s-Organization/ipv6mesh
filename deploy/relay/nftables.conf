# Replace the set members from the current relay membership snapshot.
table inet ipv6mesh {
    set overlay_ipv4 {
        type ipv4_addr
        flags interval
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        iifname "wg-mesh" oifname "wg-mesh" ip saddr @overlay_ipv4 ip daddr @overlay_ipv4 accept
    }
}
